<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonstep — playable study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1b2140;color:#ffedcf;font:14px/1.5 system-ui,-apple-system,sans-serif}.game{max-width:1000px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}h1{font:28px Georgia,serif;margin:0}header p{font-size:12px;color:#bcc1d8;margin:4px 0 0}.score{text-align:right;font-variant-numeric:tabular-nums}.score b{font-size:26px;display:block}canvas{width:100%;height:auto;display:block;border-radius:16px;touch-action:none;cursor:pointer;background:#202445}footer{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:14px}#status{font-size:12px;color:#c6c5db;max-width:600px;margin:0}button{font:600 14px system-ui;border:0;border-radius:30px;background:#b6b9eb;color:#292140;padding:13px 24px;min-width:145px;cursor:pointer}button:focus-visible,canvas:focus-visible{outline:3px solid #ffe2aa;outline-offset:4px}.credit{font-size:10px;color:#979fbb;margin:15px 0 0}@media(max-width:520px){.game{padding:12px}h1{font-size:23px}header p{font-size:10px}footer{gap:10px;align-items:flex-start}button{min-width:110px;padding:12px 15px}#status{font-size:11px}}
</style></head><body><main class="game"><header><div><h1>Moonstep</h1><p>두 개의 궤도. 한 번 눌러 길을 바꾸세요.</p></div><div class="score">ORBIT SCORE<b id="score">0</b></div></header><canvas id="game" width="960" height="520" tabindex="0" aria-label="달 궤도 게임. Space 또는 궤도 변경 버튼으로 안쪽과 바깥쪽 궤도를 바꿉니다."></canvas><footer><p id="status" role="status">바위가 있는 궤도를 피해 한 번씩 바꿔보세요.</p><button id="action" type="button">시작하기 · Space</button></footer><p class="credit">COMMON의 같은 개발 세션에서 만든 플레이 예시입니다. 특정 AI 진영의 성능을 증명하지 않습니다.</p></main>
<script>
(() => {
  'use strict';
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreNode=document.getElementById('score'),statusNode=document.getElementById('status'),button=document.getElementById('action');
  const W=960,H=520,cx=480,cy=265,radii=[126,193],TAU=Math.PI*2,speed=1.12;
  const obstacles=[{angle:Math.PI/2,lane:1},{angle:2.9,lane:0},{angle:4.35,lane:1},{angle:5.8,lane:0}];
  let state,frame=0,last=null;
  function stop(){if(frame)cancelAnimationFrame(frame);frame=0;last=null;}
  function reset(){stop();state={phase:'ready',lane:1,travel:0,elapsed:0,passed:0,score:0};paint();}
  function start(){stop();state={phase:'running',lane:1,travel:0,elapsed:0,passed:0,score:0};paint();schedule();}
  function nextObstacle(){const index=state.passed%obstacles.length,cycle=Math.floor(state.passed/obstacles.length),block=obstacles[index];return {...block,travel:block.angle+cycle*TAU,distance:block.angle+cycle*TAU-state.travel};}
  function update(dt){
    if(state.phase!=='running')return;
    state.elapsed+=dt;state.travel+=speed*dt;
    const next=nextObstacle();
    if(state.lane===next.lane&&Math.abs(next.distance)<.115){state.phase='failed';stop();}
    else if(next.distance<-.13)state.passed++;
    state.score=Math.floor(state.travel*5)+state.passed*15;
  }
  function advance(seconds){let remaining=Math.max(0,Math.min(Number(seconds)||0,30));while(remaining>0&&state.phase==='running'){const step=Math.min(remaining,1/120);update(step);remaining-=step;}paint();}
  function schedule(){if(state.phase==='running'&&!frame)frame=requestAnimationFrame(loop);}
  function loop(time){frame=0;if(state.phase!=='running')return;const dt=last===null?0:Math.min((time-last)/1000,.05);last=time;advance(dt);schedule();}
  function act(){if(state.phase==='ready'||state.phase==='failed'){start();return;}if(state.phase==='paused'){state.phase='running';paint();schedule();return;}state.lane=1-state.lane;paint();}
  function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
  function paint(){
    ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#202648');bg.addColorStop(1,'#45324e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    for(const [x,y,r]of [[83,83,2],[160,291,1.5],[220,173,2],[311,51,1.7],[650,65,1.8],[805,132,1.5],[875,328,2],[740,442,1.5],[110,445,1.8]])circle(x,y,r,'#ead7ba');
    for(const radius of radii){ctx.strokeStyle='#9585b6';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,radius,0,TAU);ctx.stroke();}
    circle(cx,cy,68,'#f2dca0');circle(cx-20,cy-13,12,'#d8bd83');circle(cx+17,cy+22,17,'#e2c78b');circle(cx+25,cy-23,8,'#dcc088');
    for(const block of obstacles){const angle=block.angle-Math.PI/2,x=cx+Math.cos(angle)*radii[block.lane],y=cy+Math.sin(angle)*radii[block.lane];circle(x,y,15,'#c69082');circle(x-3,y-3,5,'#e6b09a');}
    const angle=state.travel-Math.PI/2,r=radii[state.lane],x=cx+Math.cos(angle)*r,y=cy+Math.sin(angle)*r;
    ctx.save();ctx.translate(x,y);ctx.rotate(angle+Math.PI/2);ctx.fillStyle='#bfc3f2';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(12,13);ctx.lineTo(0,7);ctx.lineTo(-12,13);ctx.closePath();ctx.fill();circle(0,-2,4,'#343456');ctx.restore();
    ctx.font='13px system-ui';ctx.fillStyle='#e1d6d0';ctx.fillText(`${state.lane===1?'바깥':'안쪽'} 궤도 · 바위 ${state.passed}개 통과`,25,35);
    if(state.phase!=='running'){ctx.fillStyle='#181e3cad';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.font='42px Georgia';ctx.fillStyle='#ffedca';ctx.fillText(state.phase==='failed'?'Another orbit.':state.phase==='paused'?'잠깐 쉬는 중':'Find your orbit.',W/2,H/2-10);ctx.font='15px system-ui';ctx.fillStyle='#ddd1e5';ctx.fillText(state.phase==='failed'?`${state.score}점 · Space로 바로 다시 시작`:state.phase==='paused'?'버튼을 눌러 계속하기':'Space 또는 아래 버튼으로 시작',W/2,H/2+29);ctx.textAlign='left';}
    scoreNode.textContent=String(state.score);button.textContent=state.phase==='running'?'궤도 변경 · Space':state.phase==='failed'?'다시 도전 · Space':state.phase==='paused'?'계속하기 · Space':'시작하기 · Space';
    statusNode.textContent=state.phase==='failed'?`바위에 닿았어요. ${state.passed}개 통과 · 바로 다시 도전할 수 있습니다.`:state.phase==='running'?'Space / 버튼을 한 번 누르면 반대 궤도로 이동합니다. 바위가 없는 쪽을 고르세요.':state.phase==='paused'?'화면을 떠나 게임을 멈췄습니다. 계속하기를 누르세요.':'바깥 궤도에서 시작합니다. 앞의 바위를 보고 안쪽 궤도로 바꿔보세요.';
  }
  button.addEventListener('click',act);canvas.addEventListener('pointerdown',event=>{event.preventDefault();canvas.focus();act();});window.addEventListener('keydown',event=>{if(event.code==='Space'){event.preventDefault();if(!event.repeat)act();}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.phase==='running'){state.phase='paused';stop();paint();}});window.addEventListener('pagehide',stop);
  window.__COMMON_GAME_TEST__=Object.freeze({start,act,reset,tick:advance,snapshot:()=>({...state,nextHazard:{...nextObstacle()}})});
  reset();
})();
</script></body></html>
